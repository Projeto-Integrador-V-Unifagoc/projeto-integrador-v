version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: pi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: grupo_4
      POSTGRES_PASSWORD: grupo_41235
      POSTGRES_DB: projeto_integrador
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
