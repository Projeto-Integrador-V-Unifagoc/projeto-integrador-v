networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:15
    container_name: pi_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME deve ser definido no arquivo .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD deve ser definido no arquivo .env}
      POSTGRES_DB: ${DATABASE_NAME:?DATABASE_NAME deve ser definido no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pi_backend
    restart: always
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME deve ser definido no arquivo .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD deve ser definido no arquivo .env}
      DATABASE_NAME: ${DATABASE_NAME:?DATABASE_NAME deve ser definido no arquivo .env}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET deve ser definido no arquivo .env}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: pi_frontend
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
