# Banco próprio e vazio por job. Uma execução compartilha API, jornadas e UI.
name: E2E
on:
  push:
    branches: [main, develop]
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Sao_Paulo
      NODE_ENV: development
      ACADEMICO_MODO_TESTE: "true"
      EMAIL_MODO_TESTE: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/projeto_integrador_e2e
      E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5433/projeto_integrador_e2e
      E2E_API_URL: http://127.0.0.1:3100
      E2E_BACKEND_PORT: "3100"
      E2E_WEB_URL: http://127.0.0.1:5174
      VITE_API_URL: http://127.0.0.1:3100
      E2E_WORKERS: "1"
      E2E_JWT_SECRET: e2e-jwt-secret-only-for-tests-0123456789
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: projeto_integrador_e2e
          TZ: America/Sao_Paulo
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d projeto_integrador_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependências pelos lockfiles
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e
      - name: Testes unitários e PostgreSQL do backend
        run: |
          npm test --prefix backend
          npm run test:integration --prefix backend
          npm run build --prefix backend
      - name: Testes e build do frontend
        run: |
          npm test --prefix frontend
          NODE_ENV=production npm run build --prefix frontend
      - name: Migrations e seeds essenciais no banco E2E vazio
        working-directory: e2e
        run: npm run env:db
      - name: Instalar Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Iniciar backend e frontend E2E
        run: |
          cd e2e
          nohup node scripts/start-backend.mjs > backend-e2e.log 2>&1 &
          cd ../frontend
          nohup npm run preview -- --host 127.0.0.1 --port 5174 --strictPort > ../e2e/frontend-e2e.log 2>&1 &
          ready=false
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3100/cidades || true)
            web=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5174 || true)
            if [ "$api" = "200" ] && [ "$web" = "200" ]; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            cat ../e2e/backend-e2e.log ../e2e/frontend-e2e.log
            exit 1
          fi
      - name: API, integridade, jornadas e UI desktop/mobile
        working-directory: e2e
        run: npm run test:e2e -- --project=api --project=ui
      - name: Publicar relatório e traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/backend-e2e.log
            e2e/frontend-e2e.log
          retention-days: 7
